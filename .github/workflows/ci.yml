name: Validate Fradim 2.0

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate legacy route manifest
        run: npm run validate:legacy

      - name: Validate published legacy media provenance
        run: npm run validate:legacy-media

      - name: Generate Cloudflare routing artifacts
        run: npm run generate:cloudflare

      - name: Verify generated routing is committed
        run: git diff --exit-code -- public/_redirects worker/generated-legacy-removals.mjs

      - name: Test Cloudflare legacy worker
        run: npm run test:cloudflare-worker

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        id: production_build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 80 build.log > build-tail.log
          exit 0

      - name: Validate Cloudflare production routing output
        if: steps.production_build.outputs.exit_code == '0'
        run: npm run validate:cloudflare-output

      - name: Publish build diagnostic on PR
        if: steps.production_build.outputs.exit_code != '0' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Static export diagnostic"
            echo
            echo '```text'
            cat build-tail.log
            echo '```'
          } > build-comment.md
          gh pr comment "$PR_NUMBER" --body-file build-comment.md

      - name: Fail if production build failed
        if: steps.production_build.outputs.exit_code != '0'
        run: |
          cat build-tail.log
          exit 1
